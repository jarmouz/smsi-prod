{% extends 'base.html' %}
{% block title %}Exercice - {{ APP_NAME }}{% endblock %}
{% block heading %}{{ 'Modifier ' + t.ref if t else 'Nouvel exercice de continuité' }}{% endblock %}
{% block topactions %}<a href="{{ url_for('continuity.test_detail', test_id=t.id) if t else url_for('continuity.index') }}" class="btn btn--ghost btn--sm">Retour</a>{% endblock %}
{% block content %}
<form method="post" style="max-width:820px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="panel"><div class="panel__head"><h2>Exercice / test (A.5.30)</h2></div><div class="panel__body stack">
    <div class="field"><label>Intitulé *</label><input type="text" name="title" required value="{{ t.title if t else '' }}"></div>
    <div class="form-grid">
      <div class="field"><label>Type</label><select name="ttype">{% for x in TestType %}<option value="{{ x.value }}" {{ 'selected' if t and t.ttype==x }}>{{ x.label }}</option>{% endfor %}</select></div>
      <div class="field"><label>Date</label><input type="date" name="test_date" value="{{ t.test_date.isoformat() if t and t.test_date else '' }}"></div>
    </div>
    <div class="field"><label>Activités couvertes</label><select name="processes" multiple size="5">{% for p in processes %}<option value="{{ p.id }}" {{ 'selected' if t and p in t.processes }}>{{ p.ref }} - {{ p.name|truncate(50) }}</option>{% endfor %}</select></div>
    <div class="field"><label>Objectifs et scénario</label><textarea name="objectives" rows="3">{{ t.objectives or '' if t else '' }}</textarea></div>
    <div class="form-grid">
      <div class="field"><label>Résultat</label><select name="result">{% for x in TestResult %}<option value="{{ x.value }}" {{ 'selected' if t and t.result==x }}>{{ x.label }}</option>{% endfor %}</select></div>
      <div class="field"><label>RTO atteint (heures)</label><input type="text" inputmode="decimal" name="achieved_rto_hours" value="{{ ('%g'|format(t.achieved_rto_hours))|replace('.', ',') if t and t.achieved_rto_hours is not none else '' }}"></div>
    </div>
    <div class="field"><label>Constats et enseignements</label><textarea name="findings" rows="3">{{ t.findings or '' if t else '' }}</textarea></div>
    <div class="field"><label>Pilote</label><select name="owner_id"><option value="">-</option>{% for u in users %}<option value="{{ u.id }}" {{ 'selected' if t and t.owner_id==u.id }}>{{ u.name }}</option>{% endfor %}</select></div>
    <div><button class="btn btn--primary" type="submit">Enregistrer</button></div>
  </div></div>
</form>
{% endblock %}
