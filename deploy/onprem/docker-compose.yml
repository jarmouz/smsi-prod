# SMSI - déploiement sur site (on-premise)
# Les images sont fournies par le paquet de livraison (images/*.tar),
# aucune construction ni accès internet n'est nécessaire chez le client.
name: smsi

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smsi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definissez POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: smsi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smsi -d smsi"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  web:
    image: smsi-web:${SMSI_VERSION:?Definissez SMSI_VERSION dans .env}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://smsi:${POSTGRES_PASSWORD}@db:5432/smsi
      UPLOAD_DIR: /data/uploads
      TRUST_PROXY: "1"
      SESSION_COOKIE_SECURE: "1"
    volumes:
      - uploads:/data
      - ./ca:/ca:ro        # autorités de certification internes (facultatif)
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  proxy:
    image: caddy:2.8.4-alpine
    environment:
      SMSI_DOMAIN: ${SMSI_DOMAIN:?Definissez SMSI_DOMAIN dans .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
    depends_on: [web]
    networks: [internal]
    restart: unless-stopped

networks:
  internal:

volumes:
  pgdata:
  uploads:
  caddy_data:
